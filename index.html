*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);

.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}

q("#gate").addEventListener("click",async ev=>{const b=ev.target.closest("[data-ga]");if(!b)return;const a=b.dataset.ga;

  if(a==="login")gate("login",{email});

q("#gate").addEventListener("submit",async ev=>{ev.preventDefault();const f=ev.target,k=f.dataset.g,v=Object.fromEntries(new FormData(f));
  const btn=f.querySelector("[type=submit]");if(btn.disabled)return;btn.disabled=true;
  try{
    if(k==="login"){
      const {data,error}=await sb.auth.signInWithPassword({email:v.email.trim(),password:v.password});
      if(error)return gate("login",{email:v.email,err:authMsg(error)});
      await enter(data.user);
    }else if(k==="code"){
      const code=v.code.trim().toUpperCase();G.set("invite",code);await checkInvite(code);
    }else if(k==="signup"){
      if(v.password.length<8)return gate("signup",{...v,err:RESET_MSG.weak});
      const code=G.get("invite",null);if(!code)return gate("code");
      const st=await rpc("check_invite",{p_code:code});
      if(st.error)return gate("signup",{...v,err:authMsg(st.error)});
      if(st.data!=="valid"){G.set("invite",null);return gate("badinvite",{err:INVITE_MSG[st.data]||st.data})}
      G.set("invite_name",v.name.trim());
      const {data,error}=await sb.auth.signUp({email:v.email.trim(),password:v.password,options:{data:{name:v.name.trim()}}});
      if(error)return gate(/already/i.test(error.message)?"login":"signup",{...v,err:authMsg(error)});
      if(!data.session)return gate("login",{email:v.email,err:"Konto z tym adresem już istnieje albo czeka na potwierdzenie — spróbuj się zalogować."});
      await enter(data.user);
    }else if(k==="redeem"){
      if(!user)return gate("login");
      await redeem(v.code.trim().toUpperCase(),G.get("invite_name",""));
    }else if(k==="reset"){
      const {data,error}=await rpc("reset_password_with_code",{p_email:v.email.trim(),p_code:v.code.trim(),p_password:v.password});
      if(error)return gate("reset",{email:v.email,err:authMsg(error)});
      if(data!=="ok")return gate("reset",{email:v.email,err:RESET_MSG[data]||data});
      gate("login",{email:v.email,ok:"Hasło zmienione. Zaloguj się nowym hasłem."});
    }
  }finally{btn.disabled=false}
});
async function rpc(fn,args){try{return await sb.rpc(fn,args||{})}catch(e){return {error:e}}}
async function checkInvite(code){
  const {data,error}=await rpc("check_invite",{p_code:code});
  if(error)return gate("code",{err:authMsg(error)});
  if(data==="valid")return gate("signup");
  G.set("invite",null);gate("badinvite",{err:INVITE_MSG[data]||data});
}
async function redeem(code,name){
  const {data,error}=await rpc("redeem_invite",{p_code:code,p_name:name||""});
  if(error)return gate("nomember",{email:user&&user.email,err:authMsg(error)});
  G.set("invite",null);
  if(data==="ok"||data==="already"){G.set("invite_name",null);return enter(user,true)}
  gate("nomember",{email:user&&user.email,err:INVITE_MSG[data]||data});
}

async function init(){
  if(me){LSP.v=me.uid+":";loadCache();showButtons();render()}else gate("loading");
  let sess=null,err=null;
  try{const r=await sb.auth.getSession();sess=r.data&&r.data.session;err=r.error}catch(e){err=e}
  if(!sess){
    if(me&&isNet(err)){setStatus("Offline — zapisy czekają w telefonie i wyślą się po połączeniu");return}
    if(me)forget();
    const code=G.get("invite",null);
    return code?checkInvite(code):gate("login");
  }

}
async function enter(u,joined){
  user=u;
  let m=null,error=null;
  try{const r=await sb.from("members").select("user_id,display_name,is_admin,blocked,invites_left").eq("user_id",u.id).maybeSingle();m=r.data;error=r.error}catch(e){error=e}
  if(error){if(me&&me.uid===u.id&&isNet(error)){setStatus("Offline — zapisy czekają w telefonie");return}return gate("login",{err:authMsg(error)})}
  if(!m){const code=G.get("invite",null);if(code)return redeem(code,G.get("invite_name",""));return gate("nomember",{email:u.email})}
  if(m.blocked)return gate("blocked");
  const switched=!me||me.uid!==u.id;
  me={uid:u.id,email:u.email,name:m.display_name,admin:m.is_admin,invites_left:m.invites_left};G.set("me",me);
  LSP.v=me.uid+":";if(switched)loadCache();
  closeGate();showButtons();render();
  rpc("touch");
  await flush();await pull();

}

function forget(){me=null;user=null;G.set("me",null);LSP.v="";S.videos={};S.sessions=[];S.swaps={};S.settings={};applyPlan(null,"file");showButtons();render()}
async function logout(force){

/* ---------------------------------------------------------------- dane: kolejka zapisów (działa offline) + pobieranie */
const pending=()=>LS.get("outbox",[]);
function sync(kind,key,val){
  const ob=pending().filter(o=>!(o.kind===kind&&o.key===key));ob.push({kind,key,val});LS.set("outbox",ob);
  flush();   // bez czekania: zapis lokalny już jest, wysyłka w tle
}
let flushing=false,again=false;
async function flush(){
  if(!me)return;if(flushing){again=true;return}flushing=true;
  try{do{again=false;
    for(const o of pending()){
      const err=await send(o);
      if(err){setStatus(isNet(err)?`Offline — ${pending().length} ${pending().length===1?"zmiana czeka":"zmian czeka"} na wysłanie`:"Nie udało się zapisać na koncie: "+(err.message||err));return}
      const cur=pending(),i=cur.findIndex(x=>x.kind===o.kind&&x.key===o.key&&JSON.stringify(x.val)===JSON.stringify(o.val));
      if(i>=0){cur.splice(i,1);LS.set("outbox",cur)}
    }}while(again);
    setStatus("Zapisane na koncie");
  }finally{flushing=false}
}
async function send(o){
  const u=me.uid,v=o.val,now=new Date().toISOString(),T=t=>sb.from(t);let r;
  try{switch(o.kind){
    case "session":r=v==null?await T("sessions").delete().eq("user_id",u).eq("session_key",o.key)
      :await T("sessions").upsert({user_id:u,session_key:o.key,day:v.day,date:v.date,week:v.week??null,plan_id:v.plan??null,note:v.note||"",ex:v.ex||{},ts:v.ts??null,updated_at:now},{onConflict:"user_id,session_key"});break;
    case "swap":r=v==null?await T("swaps").delete().eq("user_id",u).eq("slot",o.key)
      :await T("swaps").upsert({user_id:u,slot:o.key,cat:v.cat,ts:v.ts??null},{onConflict:"user_id,slot"});break;
    case "video":r=await T("videos").upsert({user_id:u,slot:o.key,url:v.url||"",name:v.name||"",cat:v.cat||null},{onConflict:"user_id,slot"});break;
    case "plan":r=v==null?await T("plans").delete().eq("user_id",u)
      :await T("plans").upsert({user_id:u,plan:v.plan,updated_at:now},{onConflict:"user_id"});break;
    case "settings":r=await T("user_settings").upsert({user_id:u,block_start:v.start||null,plan_id:v.planId||null,updated_at:now},{onConflict:"user_id"});break;
    default:return null}
  }catch(e){return e}
  return r&&r.error;
}
let lastPull=0;
async function pull(){
  if(!me||pending().length)return;   // najpierw wyślij swoje zmiany
  lastPull=Date.now();const T=t=>sb.from(t);
  let res;try{res=await Promise.all([T("plans").select("plan,updated_at").maybeSingle(),T("user_settings").select("block_start,plan_id").maybeSingle(),
    T("sessions").select("session_key,day,date,week,plan_id,note,ex,ts").order("ts",{ascending:false}).limit(2000),
    T("swaps").select("slot,cat,ts"),T("videos").select("slot,url,name,cat")])}catch(e){return}
  if(res.some(r=>r.error)||pending().length)return;
  const [pl,st,se,sw,vi]=res.map(r=>r.data);
  S.sessions=(se||[]).map(r=>({id:r.session_key,day:r.day,date:r.date,week:r.week,plan:r.plan_id,note:r.note,ex:r.ex||{},ts:r.ts}));
  S.swaps=Object.fromEntries((sw||[]).map(r=>[r.slot,{cat:r.cat,ts:r.ts}]));
  S.videos=Object.fromEntries((vi||[]).map(r=>[r.slot,r.cat?{url:r.url,name:r.name,cat:r.cat}:{url:r.url,name:r.name}]));
  S.settings=st?Object.fromEntries(Object.entries({start:st.block_start,planId:st.plan_id}).filter(([,x])=>x)):{};
  const lp=pl?{plan:pl.plan,ts:Date.parse(pl.updated_at)}:null;
  LS.set("ab.sessions",S.sessions);LS.set("ab.swaps",S.swaps);LS.set("ab.videos",S.videos);LS.set("ab.settings",S.settings);LS.set("ab.plan",lp);
  const curId=PLANOBJ&&PLANOBJ.id;if(!lp||!lp.plan||lp.plan.id!==curId)applyPlan(lp?lp.plan:DATA.plan,lp?"creator":"file");
  render();if(creatorOpen)renderCreator();if(swapFor)renderSwap();
}
window.addEventListener("online",()=>{if(me)flush().then(pull)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&me&&Date.now()-lastPull>30000)flush().then(pull)});
setInterval(()=>{if(me&&pending().length&&navigator.onLine)flush()},60000);

  const okPlan=f.plan&&f.plan.id&&Array.isArray(f.plan.days);
  imp={from:i.files[0].name,plan:okPlan?f.plan:null,settings:f.settings||null,
    sessions:f.sessions.filter(x=>x&&x.id&&x.day&&x.date&&x.ex),swaps:f.swaps||{},videos:f.videos||{}};
  ac={};renderAcct();
});
function doImport(d){
  if(d.plan){LS.set("ab.plan",{plan:d.plan,ts:Date.now()});applyPlan(d.plan,"creator");sync("plan",null,{plan:d.plan})}
  if(d.settings&&(d.settings.start||d.settings.planId)){S.settings={...d.settings};LS.set("ab.settings",S.settings);sync("settings",null,S.settings)}
  const ids=new Set(d.sessions.map(x=>x.id));
  S.sessions=[...d.sessions,...S.sessions.filter(x=>!ids.has(x.id))].sort((a,b)=>(b.ts||0)-(a.ts||0));LS.set("ab.sessions",S.sessions);
  d.sessions.forEach(x=>{const {id,...rest}=x;sync("session",id,rest)});
  Object.entries(d.swaps).forEach(([k,v])=>{if(v&&v.cat){S.swaps[k]=v;sync("swap",k,v)}});LS.set("ab.swaps",S.swaps);
  Object.entries(d.videos).forEach(([k,v])=>{if(v&&isUrl(v.url||"")){S.videos[k]={url:v.url,name:String(v.name||"").slice(0,120),...(v.cat?{cat:String(v.cat)}:{})};sync("video",k,S.videos[k])}});LS.set("ab.videos",S.videos);
  render();return d.sessions.length;
}

,"equipment":"body only","level":"intermediate","yt_query":{"en":"Copenhagen Plank proper form","pl":"Deska kopenhaska technika"}},"tibialis-raise":{"name_pl":"Unoszenie palców stóp (piszczelowy przedni)","name_en":"Tibialis Raise","aliases":["tibialis","piszczelowy","przód goleni"],"measure":"reps","pattern":"calf","basic":false,"primary":["calves"],"equipment":"body only","level":"beginner","mechanic":"isolation","yt_query":{"en":"Tibialis Raise proper form","pl":"Unoszenie palców stóp (piszczelowy przedni) technika"}},"bird-dog":{"name_pl":"Bird dog (naprzemienne wyprosty w klęku podpartym)","name_en":"Bird Dog","aliases":["bird dog","pies z ptakiem","klęk podparty"],"measure":"reps_side","pattern":"core_stab","basic":true,"primary":["lower back"],"equipment":"body only","level":"beginner","yt_query":{"en":"Bird Dog proper form","pl":"Bird dog (naprzemienne wyprosty w klęku podpartym) technika"}},"hollow-body-hold":{"name_pl":"Hollow body (łódka)","name_en":"Hollow Body Hold","aliases":["łódka","hollow hold"],"measure":"time","pattern":"core_stab","basic":false,"primary":["abdominals"],"equipment":"body only","level":"beginner","yt_query":{"en":"Hollow Body Hold proper form","pl":"Hollow body (łódka) technika"},"easier":["dead-bug"],"harder":["toes-to-bar"],"avoid":"Ból pleców"},"eccentric-step-down":{"name_pl":"Zejście ekscentryczne ze stopnia","name_en":"Eccentric Step-Down","aliases":["step down","zejście ze stopnia","zbiegi","ekscentryka czworogłowe"],"measure":"reps_side","pattern":"single_leg","basic":true,"primary":["quadriceps"],"equipment":"body only","level":"beginner","mechanic":"compound","instructions_pl":["Stań na stopniu (10–20 cm) na jednej nodze, druga noga wysunięta poza krawędź.","Powoli (3–4 s) uginaj kolano nogi podporowej, aż pięta drugiej nogi dotknie podłogi.","Kolano nad stopą, miednica równo, tułów lekko pochylony.","Wróć do góry, pomagając sobie drugą nogą. Przygotowuje czworogłowe do zbiegów."],"yt_query":{"en":"Eccentric Step-Down proper form","pl":"Zejście ekscentryczne ze stopnia technika"},"easier":["step-up-dumbbell"],"harder":["single-leg-squat-to-box","pistol-squat"],"avoid":"Ostry ból kolana"},"single-leg-squat-to-box":{"name_pl":"Przysiad na jednej nodze do skrzyni","name_en":"Single-Leg Box Squat","aliases":["przysiad jednonóż do ławki","single leg box squat"],"measure":"reps_side","pattern":"single_leg","basic":false,"primary":["quadriceps"],"equipment":"body only","level":"intermediate","mechanic":"compound","instructions_pl":["Stań przed skrzynią lub ławką na jednej nodze, ręce przed sobą.","Powoli siadaj na skrzynię, kontrolując kolano nad stopą.","Dotknij skrzyni bez opadania i wstań tą samą nogą.","Łatwiej: wyższa skrzynia. Trudniej: niższa lub z hantlem."],"yt_query":{"en":"Single-Leg Box Squat proper form","pl":"Przysiad na jednej nodze do skrzyni technika"},"easier":["eccentric-step-down","bulgarian-split-squat"],"harder":["pistol-squat"],"avoid":"Ból kolana"},"lateral-step-up":{"name_pl":"Wejścia bokiem na skrzynię","name_en":"Lateral Step-Up","aliases":["lateral step up","wejścia boczne"],"measure":"reps_side","pattern":"single_leg","basic":false,"primary":["quadriceps"],"equipment":"dumbbell","level":"beginner","mechanic":"compound","instructions_pl":["Stań bokiem do skrzyni, bliższa stopa na skrzyni.","Wejdź, prostując nogę na skrzyni; dolna noga tylko lekko pomaga.","Miednica równo, kolano nie ucieka do środka.","Zejdź powoli. Wzmacnia mięśnie stabilizujące biodro i kolano."],"yt_query":{"en":"Lateral Step-Up proper form","pl":"Wejścia bokiem na skrzynię technika"},"harder":["step-up-dumbbell"],"avoid":"Ból kolana"},"spanish-squat":{"name_pl":"Przysiad hiszpański (izometria z taśmą)","name_en":"Spanish Squat","aliases":["spanish squat","izometria kolana","przysiad z taśmą za kolanami"],"measure":"time","pattern":"knee_ext","basic":false,"primary":["quadriceps"],"equipment":"bands","level":"beginner","mechanic":"compound","instructions_pl":["Zaczep mocną taśmę o stabilny słup i stań w niej tak, by przechodziła za kolanami.","Odchyl się, aż taśma się napnie, i zejdź do półprzysiadu z pionowymi piszczelami.","Utrzymaj pozycję 30–45 s, oddychając spokojnie.","Izometria dla ścięgna rzepki. Dyskomfort do 3/10, bez ostrego bólu."],"yt_query":{"en":"Spanish Squat proper form","pl":"Przysiad hiszpański (izometria z taśmą) technika"},"easier":["wall-sit"],"avoid":"Ostry ból kolana"},"wall-sit":{"name_pl":"Krzesełko przy ścianie","name_en":"Wall Sit","aliases":["krzesełko","wall sit","izometria ud"],"measure":"time","pattern":"knee_ext","basic":false,"primary":["quadriceps"],"equipment":"body only","level":"beginner","mechanic":"compound","instructions_pl":["Oprzyj plecy o ścianę i zjedź w dół, aż uda będą prawie równoległe do podłogi.","Kolana nad stopami, ciężar na piętach.","Utrzymaj czas, oddychając spokojnie.","Łatwiej: płycej. Trudniej: głębiej lub z ciężarem na udach."],"yt_query":{"en":"Wall Sit proper form","pl":"Krzesełko przy ścianie technika"},"harder":["spanish-squat"],"avoid":"Ostry ból kolana"},"calf-raise-bent-knee":{"name_pl":"Wspięcia na palce z ugiętym kolanem (jednonóż)","name_en":"Bent-Knee Single-Leg Calf Raise","aliases":["płaszczkowaty","soleus","łydka ugięte kolano"],"measure":"reps_side","pattern":"calf","basic":true,"primary":["calves"],"equipment":"dumbbell","level":"beginner","mechanic":"isolation","instructions_pl":["Stań na jednej nodze na stopniu, kolano ugięte ok. 30–45° i takie zostaje przez cały ruch.","Opuść piętę poniżej krawędzi, potem wspnij się wysoko na palce.","Tempo spokojne, bez odbijania; hantel w ręce po tej samej stronie.","Wzmacnia mięsień płaszczkowaty, mocno pracujący przy długim bieganiu."],"yt_query":{"en":"Bent-Knee Single-Leg Calf Raise proper form","pl":"Wspięcia na palce z ugiętym kolanem (jednonóż) technika"},"easier":["calf-raise-seated-machine"],"harder":["eccentric-heel-drop"],"avoid":"Ostry ból Achillesa"},"eccentric-heel-drop":{"name_pl":"Ekscentryczne opuszczanie pięty ze stopnia","name_en":"Eccentric Heel Drop","aliases":["heel drop","opuszczanie pięty","achilles","alfredson"],"measure":"reps_side","pattern":"calf","basic":false,"primary":["calves"],"equipment":"body only","level":"beginner","mechanic":"isolation","instructions_pl":["Stań na stopniu przednią częścią stóp, wejdź na palce na obu nogach.","Przenieś ciężar na jedną nogę i powoli (3–4 s) opuść piętę poniżej krawędzi.","Wróć na górę obiema nogami i powtórz.","Wykonuj z prostym i z ugiętym kolanem. Przy bólu ścięgna Achillesa skonsultuj dawkę z fizjoterapeutą."],"yt_query":{"en":"Eccentric Heel Drop proper form","pl":"Ekscentryczne opuszczanie pięty ze stopnia technika"},"easier":["calf-raise-dumbbell"],"harder":["isometric-calf-hold"],"avoid":"Ostry ból Achillesa — dawka z fizjoterapeutą"},"isometric-calf-hold":{"name_pl":"Izometryczne wspięcie na palce z obciążeniem","name_en":"Isometric Calf Raise Hold","aliases":["izometria łydki","calf hold"],"measure":"time_side","pattern":"calf","basic":false,"primary":["calves"],"equipment":"dumbbell","level":"beginner","mechanic":"isolation","instructions_pl":["Stań na jednej nodze, wspięty na palce w połowie zakresu, z hantlem w ręce.","Utrzymaj pozycję 30–45 s, kolano lekko ugięte lub proste.","Przytrzymaj się drugą ręką dla równowagi.","Izometria dla łydki i ścięgna Achillesa."],"yt_query":{"en":"Isometric Calf Raise Hold proper form","pl":"Izometryczne wspięcie na palce z obciążeniem technika"},"easier":["calf-raise-single-leg"],"avoid":"Ostry ból Achillesa"},"pogo-hops":{"name_pl":"Podskoki pogo (sprężynowanie na stopach)","name_en":"Pogo Hops","aliases":["pogo","sprężynowanie","podskoki obunóż"],"measure":"reps","pattern":"plyo","basic":true,"primary":["calves"],"equipment":"body only","level":"beginner","mechanic":"compound","instructions_pl":["Stań prosto, kolana lekko ugięte, ręce luźno.","Odbijaj się krótko i sprężyście z przedniej części stóp, minimalnie zginając kolana.","Kontakt z podłożem jak najkrótszy, cicho, w rytmie.","Zacznij od 2–3 serii po 15–20 skoków. Nie przy bolących łydkach."],"yt_query":{"en":"Pogo Hops proper form","pl":"Podskoki pogo (sprężynowanie na stopach) technika"},"easier":["jump-rope"],"harder":["single-leg-pogo"],"avoid":"Bolące łydki, Achilles, dzień przed długim biegiem"},"single-leg-pogo":{"name_pl":"Podskoki pogo na jednej nodze","name_en":"Single-Leg Pogo Hops","aliases":["pogo jednonóż","podskoki jednonóż"],"measure":"reps_side","pattern":"plyo","basic":false,"primary":["calves"],"equipment":"body only","level":"intermediate","mechanic":"compound","instructions_pl":["Jak pogo, ale na jednej nodze; kolano lekko ugięte.","Krótkie, sprężyste odbicia z przedniej części stopy, miednica równo.","Lądowanie ciche, kolano nad stopą.","Wprowadzaj po opanowaniu pogo obunóż; mała objętość."],"yt_query":{"en":"Single-Leg Pogo Hops proper form","pl":"Podskoki pogo na jednej nodze technika"},"easier":["pogo-hops"],"avoid":"Jak pogo"},"hip-hike":{"name_pl":"Unoszenie miednicy na stopniu (hip hike)","name_en":"Hip Hike","aliases":["hip hike","pelvic drop","pośladek średni"],"measure":"reps_side","pattern":"hip_abd_add","basic":false,"primary":["abductors"],"equipment":"body only","level":"beginner","mechanic":"isolation","instructions_pl":["Stań bokiem na stopniu na jednej nodze, druga noga zwisa poza krawędzią.","Opuść miednicę po stronie wiszącej nogi, nie zginając kolana podporowego.","Unieś miednicę wyżej niż poziomo, pracując pośladkiem nogi podporowej.","Ruch mały i powolny. Wzmacnia mięsień pośladkowy średni."],"yt_query":{"en":"Hip Hike proper form","pl":"Unoszenie miednicy na stopniu (hip hike) technika"},"easier":["side-lying-hip-abduction"],"harder":["lateral-step-up"],"avoid":"—"},"side-lying-hip-abduction":{"name_pl":"Odwodzenie nogi leżąc bokiem","name_en":"Side-Lying Hip Abduction","aliases":["odwodzenie leżąc","pośladek średni"],"measure":"reps_side","pattern":"hip_abd_add","basic":true,"primary":["abductors"],"equipment":"body only","level":"beginner","mechanic":"isolation","instructions_pl":["Połóż się bokiem, dolna noga ugięta, górna prosta w linii tułowia.","Unieś górną nogę lekko w tył i w górę, palce stopy skierowane do przodu.","Zatrzymaj na 1 s i opuść powoli.","Nie odchylaj miednicy do tyłu. Trudniej: miniband nad kolanami."],"yt_query":{"en":"Side-Lying Hip Abduction proper form","pl":"Odwodzenie nogi leżąc bokiem technika"},"easier":["clamshell"],"harder":["hip-hike","monster-walk"],"avoid":"—"},"clamshell":{"name_pl":"Muszelka z minibandem","name_en":"Clamshell","aliases":["muszelka","clamshell","miniband"],"measure":"reps_side","pattern":"hip_abd_add","basic":false,"primary":["abductors"],"equipment":"bands","level":"beginner","mechanic":"isolation","instructions_pl":["Połóż się bokiem, kolana ugięte ok. 45°, miniband nad kolanami.","Stopy razem; unieś górne kolano, nie przetaczając miednicy do tyłu.","Zatrzymaj na górze, opuść powoli.","Celem jest praca pośladka, nie odchylenie tułowia."],"yt_query":{"en":"Clamshell proper form","pl":"Muszelka z minibandem technika"},"harder":["side-lying-hip-abduction"],"avoid":"—"},"short-foot":{"name_pl":"Krótka stopa (aktywacja łuku stopy)","name_en":"Short Foot","aliases":["krótka stopa","łuk stopy","short foot"],"measure":"reps","pattern":"calf","basic":false,"primary":["calves"],"equipment":"body only","level":"beginner","mechanic":"isolation","instructions_pl":["Usiądź lub stań boso, stopa płasko na podłodze.","Skróć stopę, przyciągając przednią część w stronę pięty i unosząc łuk, bez zginania palców.","Utrzymaj 5–10 s, rozluźnij.","Aktywuje mięśnie stopy pracujące przy długim bieganiu."],"yt_query":{"en":"Short Foot proper form","pl":"Krótka stopa (aktywacja łuku stopy) technika"},"avoid":"—"},"suitcase-carry":{"name_pl":"Noszenie ciężaru w jednej ręce","name_en":"Suitcase Carry","aliases":["suitcase carry","walizka","noszenie jednorącz"],"measure":"time_side","pattern":"carry","basic":true,"primary":["abdominals"],"equipment":"dumbbell","level":"beginner","mechanic":"compound","instructions_pl":["Weź ciężki hantel lub kettlebell w jedną rękę.","Idź prosto, nie przechylając się w stronę ciężaru; bark nisko, brzuch napięty.","Po czasie lub dystansie zmień rękę.","Wzmacnia boczne mięśnie tułowia — przydatne przy długim biegu i z plecakiem."],"yt_query":{"en":"Suitcase Carry proper form","pl":"Noszenie ciężaru w jednej ręce technika"},"easier":["side-plank"],"harder":["farmers-walk"],"avoid":"Ból pleców"},"loaded-incline-walk":{"name_pl":"Marsz pod górę z obciążeniem","name_en":"Loaded Incline Walk","aliases":["marsz z plecakiem","bieżnia pod górę","rucking","weighted vest walk"],"measure":"time","pattern":"cardio","basic":false,"primary":["quadriceps"],"equipment":"other","level":"beginner","mechanic":"compound","instructions_pl":["Na bieżni ustaw nachylenie 10–15% lub idź pod górę w terenie, w plecaku lub kamizelce z obciążeniem.","Krok równy, tułów lekko pochylony, mocne odepchnięcie z całej stopy.","Tempo, w którym możesz rozmawiać.","Przygotowuje do długich podejść. Obciążenie zwiększaj stopniowo."],"yt_query":{"en":"Loaded Incline Walk proper form","pl":"Marsz pod górę z obciążeniem technika"},"avoid":"Ból Achillesa lub kolana"},"knee-to-wall":{"name_pl":"Kolano do ściany (ruchomość stawu skokowego)","name_en":"Knee to Wall","aliases":["knee to wall","skokowy","ruchomość kostki"],"measure":"reps_side","pattern":"mobility","basic":true,"primary":["calves"],"equipment":"body only","level":"beginner","instructions_pl":["Stań przodem do ściany w małym wykroku, palce przedniej stopy kilka cm od ściany.","Przesuwaj kolano do ściany, nie odrywając pięty od podłogi.","Gdy łatwo dotykasz, odsuń stopę o 1 cm.","Poprawia ruchomość stawu skokowego; ruch powolny, bez bólu."],"yt_query":{"en":"Knee to Wall proper form","pl":"Kolano do ściany (ruchomość stawu skokowego) technika"},"avoid":"—"},"hip-90-90":{"name_pl":"Pozycja 90/90 (rotacje bioder)","name_en":"90/90 Hip Switch","aliases":["90/90","rotacje bioder"],"measure":"reps","patte const CAT = DATA.catalog, DICT = DATA.dict, GOALS = DATA.goals;
/* the active plan: the one built into this file, or one made with the creator (stored in db: meta/plan) */
let PLANOBJ=null, BLOCK={}, PLAN={}, DAYS=[], RETIRED={}, WARM={title:"",items:[]}, planSource="file";
function setPlan(po,source){
  PLANOBJ=po;planSource=source;PLAN={};DAYS=[];RETIRED={};
  if(!po){BLOCK={weeks:8,late_from_week:3,stage_hints:[],default_start:today()};WARM={title:"",items:[]};return}
  BLOCK=po.block;WARM=po.warmup||{title:"",items:[]};DAYS=po.days.map(d=>d.key);
  /* a plan slot: what the plan prescribes; the exercise itself can be swapped by the user (S.swaps) */
  po.days.forEach(d=>{PLAN[d.key]={title:d.title,sub:d.sub,tab:d.tab,weekdays:d.weekdays,ex:d.exercises.map(x=>({
    id:x.slot,def:x.exercise,planName:x.name||(CAT[x.exercise]||{}).name_pl||x.exercise,early:x.sets.early,late:x.sets.late,
    rest:x.rest,sec:x.rest_sec,planNote:x.note||"",planLoad:x.load_label||""}))}});
  /* exercises removed from the plan — kept so saved history still shows them */
  RETIRED=Object.fromEntries(Object.entries(po.retired||{}).map(([k,v])=>[k,v.name]));
}
/* effective exercise for a slot: plan default or the user's swap */
function eff(slot){
  const cat=(S.swaps[slot.id]&&CAT[S.swaps[slot.id].cat])?S.swaps[slot.id].cat:slot.def, c=CAT[cat]||{}, swapped=cat!==slot.def;
  return {...slot,cat,swapped,name:swapped?(c.name_pl||cat):slot.planName,note:swapped?"":slot.planNote,load:swapped?"":slot.planLoad,
    unit:String(c.measure||"").startsWith("time")?"s":"",tips:c.instructions_pl||[],
    qpl:(c.yt_query||{}).pl||c.name_pl||cat,qen:(c.yt_query||{}).en||c.name_en||cat,video:((c.videos||[])[0]||{}).url||""};
}
const slotById=id=>{for(const k in PLAN){const e=PLAN[k].ex.find(x=>x.id===id);if(e)return e}return null};
/* user's own link/name belong to an exercise: legacy entries (no cat) belong to the plan default */
function vid(E){const v=S.videos[E.id];return v&&(v.cat||E.def)===E.cat?v:{}}
const norm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ł/g,"l");

const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
setPlan(DATA.plan,"file");

/* ---------- storage: this browser (cache) + artifact db or, in the web version, Supabase (WEB in web.js) ---------- */
const LSP={v:""};   /* key prefix: web version keeps each account's cache apart */
const LS={get(k,d){try{const v=localStorage.getItem(LSP.v+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(LSP.v+k,JSON.stringify(v))}catch(e){}}};
let db=null;
const S={videos:{},sessions:[],swaps:{},settings:{}};
function loadCache(){
  S.videos=LS.get("ab.videos",{});S.sessions=LS.get("ab.sessions",[]);S.swaps=LS.get("ab.swaps",{});S.settings=LS.get("ab.settings",{});
  const lp=LS.get("ab.plan",null);if(lp&&lp.plan)applyPlan(lp.plan,"creator");else applyPlan(DATA.plan,"file");
}
async function initStore(){
  if(window.WEB)return WEB.init();
  loadCache();render();
  try{ db = window.claude ? await window.claude.use("db") : null }catch(e){db=null}
  if(!db){setStatus("Zapis lokalny w tej przeglądarce");return}
  setStatus("Synchronizacja włączona");
  db.collection("videos").onSnapshot(s=>{const v={};s.docs.forEach(d=>v[d.id]=d.data());S.videos=v;render()},()=>{});
  db.collection("sessions").orderBy("ts","desc").limit(300).onSnapshot(s=>{S.sessions=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  db.collection("swaps").onSnapshot(s=>{const v={};s.docs.forEach(d=>v[d.id]=d.data());S.swaps=v;LS.set("ab.swaps",v);render();if(swapFor)renderSwap()},()=>{});
  db.doc("meta/plan").onSnapshot(s=>{const v=s.exists?s.data():null;LS.set("ab.plan",v);
    if(v&&v.plan)applyPlan(v.plan,"creator");else if(planSource==="creator")applyPlan(DATA.plan,"file");render();if(creatorOpen)renderCreator()},()=>{});
  db.doc("meta/settings").onSnapshot(s=>{if(s.exists){S.settings={...S.settings,...s.data()};render()}},()=>{});
}
function setStatus(t){document.getElementById("status").textContent=t}
/* write one record to the backend; val null = delete. kinds: video, swap, session, plan, settings */
const DOCPATH={video:k=>"videos/"+k,swap:k=>"swaps/"+k,session:k=>"sessions/"+k,plan:()=>"meta/plan",settings:()=>"meta/settings"};
async function sync(kind,key,val,msg){
  if(window.WEB)return WEB.sync(kind,key,val);
  if(!db)return;
  try{const d=db.doc(DOCPATH[kind](key));if(val==null)await d.delete();else await d.set(val)}catch(e){if(msg)setStatus(msg)}
}
async function saveVideo(id,obj){S.videos={...S.videos,[id]:obj};LS.set("ab.videos",S.videos);await sync("video",id,obj,"Nie udało się zsynchronizować linku")}
async function saveSwap(slot,cat){
  const def=(slotById(slot)||{}).def;const sw={...S.swaps};
  if(!cat||cat===def)delete sw[slot];else sw[slot]={cat,ts:Date.now()};
  S.swaps=sw;LS.set("ab.swaps",sw);
  await sync("swap",slot,sw[slot]||null,"Nie udało się zsynchronizować zamiany — jest zapisana w tej przeglądarce");
}
async function saveSession(s){S.sessions=[s,...S.sessions.filter(x=>x.id!==s.id)];LS.set("ab.sessions",S.sessions);const {id,...rest}=s;await sync("session",id,rest,"Nie udało się zsynchronizować treningu — jest zapisany w tej przeglądarce")}
async function deleteSession(id){S.sessions=S.sessions.filter(x=>x.id!==id);LS.set("ab.sessions",S.sessions);await sync("session",id,null)}
/* after a plan change: keep the tab the user picked if it still exists, otherwise today's day */
function applyPlan(po,source){setPlan(po,source);if(!viewChosen||(!PLAN[view]&&view!=="H"))view=defaultView()}
async function savePlan(po){
  const v={plan:po,ts:Date.now()};LS.set("ab.plan",v);applyPlan(po,"creator");
  await saveSettings({start:po.block.default_start,planId:po.id});
  await sync("plan",null,v,"Nie udało się zsynchronizować planu — jest zapisany w tej przeglądarce")}
async function clearPlan(){
  LS.set("ab.plan",null);applyPlan(DATA.plan,"file");
  await sync("plan",null,null)}
async function saveSettings(o){S.settings={...S.settings,...o};LS.set("ab.settings",S.settings);await sync("settings",null,S.settings)}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* block start: a saved start date belongs to one plan (no planId = the plan built into this file) */
function blockStart(){const pid=S.settings.planId||(DATA.plan&&DATA.plan.id);return (S.settings.start&&PLANOBJ&&pid===PLANOBJ.id)?S.settings.start:BLOCK.default_start}
function blockWeek(){const s=new Date(blockStart()+"T00:00:00"),n=new Date(today()+"T00:00:00");return Math.max(1,Math.floor((n-s)/864e5/7)+1)}
const target=e=>blockWeek()<BLOCK.late_from_week?e.early:e.late;
const setsCount=t=>{const m=String(t).match(/(\d)(?:–(\d))?\s*×/);return m?+(m[2]||m[1]):2};
const fmtDate=d=>new Date(d+"T12:00:00").toLocaleDateString("pl-PL",{weekday:"short",day:"numeric",month:"short"});
function isUrl(u){try{const x=new URL(u);return x.protocol==="https:"||x.protocol==="http:"}catch(e){return false}}
/* only http(s) links ever reach an href, also for links from the database or an imported file */
function safeUrl(u){return u&&isUrl(u)?u:""}
function exName(E){return vid(E).name||E.name}

/* ---------- draft (per day, this browser) ---------- */
let view=null, viewChosen=false, editing=null, saved=null;
function draft(day){
  let d=LS.get("ab.draft."+day,null);
  if(!d||d.date!==today())d={date:today(),ex:{},note:""};
  PLAN[day].ex.forEach(e=>{if(!d.ex[e.id]){const n=setsCount(target(e));d.ex[e.id]={sets:Array.from({length:n},()=>({w:"",r:""})),rir:""}}});
  return d;
}
const putDraft=(day,d)=>LS.set("ab.draft."+day,d);
/* last result of the same exercise on the same day of the plan (same slot first, then any slot) */
function lastFor(day,E){
  const has=v=>v&&v.sets&&v.sets.some(t=>t.w||t.r), isE=(k,v)=>(v.cat||((slotById(k)||{}).def))===E.cat;
  for(const s of S.sessions){if(s.day!==day||!s.ex)continue;
    const v=s.ex[E.id];if(has(v)&&isE(E.id,v))return {date:s.date,...v};
    const o=Object.entries(s.ex).find(([k,v])=>has(v)&&isE(k,v));if(o)return {date:s.date,...o[1]}}
  return null}
const setsTxt=x=>x.sets.filter(t=>t.w||t.r).map(t=>(t.w?t.w+"×":"")+(t.r||"–")).join(" · ");

/* ---------- render ---------- */
function render(){
  document.body.classList.toggle("dayB",DAYS.indexOf(view)%2===1);
  $("#title").textContent=PLANOBJ?PLANOBJ.name:"Siłownia";
  const tabs=[...DAYS.map((k,i)=>`<button class="tab c${i%2}" role="tab" data-v="${esc(k)}" type="button">${esc(PLAN[k].tab||k)}</button>`),`<button class="tab" role="tab" data-v="H" type="button">Historia</button>`].join("");
  if($("#tabs").innerHTML!==tabs)$("#tabs").innerHTML=tabs;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===view));
  $("#weekBtn").hidden=!PLANOBJ;$("#weekBtn").textContent="Tydzień "+blockWeek()+" z "+BLOCK.weeks;
  if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#main input,#main textarea,#main select"))return; // don't clobber typing
  $("#main").innerHTML = !PLANOBJ&&view!=="H"?`<div class="empty">Nie masz jeszcze planu. <button class="btn pri" data-act="creator" type="button">Ułóż plan</button></div>`:view==="H"?renderHistory():renderDay(view);
}
function renderDay(day){
  const P=PLAN[day],d=draft(day),w=blockWeek();
  let h=`<div class="dayhead"><span class="k">Trening ${day} · tydz. ${w}${w>BLOCK.weeks?" (po bloku)":""}</span><h2>${esc(P.title)}</h2><p>${esc(P.sub)}. ${esc((BLOCK.stage_hints.find(x=>w>=x.from&&w<=x.to)||{}).text||"")}</p></div>`;
  h+=`<details class="warm"><summary>${esc(WARM.title)}</summary><ul>${WARM.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`;
  P.ex.forEach((slot,i)=>{
    const e=eff(slot),v=vid(e),x=d.ex[e.id]||{sets:[{w:"",r:""}],rir:""},prev=lastFor(day,e);
    const done=x.sets.length&&x.sets.every(t=>t.r);
    h+=`<section class="ex${done?" done":""}" data-ex="${e.id}">
      <div class="exh"><span class="num">${i+1}</span><div class="t"><h3>${esc(exName(e))}</h3>
        <div class="meta"><span class="chip">${esc(target(e))}</span><span class="chip m">przerwa ${esc(e.rest)}</span></div></div>
        <button class="btn sm ghost swapbtn" data-act="swap" type="button" aria-label="Zamień ćwiczenie">⇄ Zamień</button></div>
      ${e.swapped?`<p class="note swapped">Zamiast: ${esc(slot.planName)} · <button class="linkbtn" data-act="restore" type="button">przywróć z planu</button></p>`:""}
      ${e.note?`<p class="note">${esc(e.note)}</p>`:""}
      ${e.tips.length?`<details class="tech"><summary>Technika</summary><ul>${e.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></details>`:""}
      ${editing===e.id?linkForm(e,v):`<div class="yt">${safeUrl(v.url||e.video)?`<a class="btn play" href="${esc(safeUrl(v.url||e.video))}" target="_blank" rel="noopener">▶ Jak ćwiczyć</a><button class="btn sm ghost" data-act="edit" type="button">Zmień link</button>`:`<button class="btn ghost" data-act="edit" type="button">+ Wklej link YouTube</button><span class="ytsearch">Szukaj na YT: <a class="btn sm" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.qpl)}" target="_blank" rel="noopener">PL</a><a class="btn sm" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.qen)}" target="_blank" rel="noopener">EN</a></span>`}</div>`}
      <div class="sets"><span class="h">#</span><span class="h">${esc(e.load||"Kg / ust.")}</span><span class="h">${e.unit==="s"?"Sekundy":"Powt."}</span><span></span>
      ${x.sets.map((t,k)=>`<span class="n">${k+1}</span><input id="w-${day}-${e.id}-${k}" data-f="w" data-k="${k}" value="${esc(t.w)}" inputmode="text" aria-label="Seria ${k+1} ciężar"><input id="r-${day}-${e.id}-${k}" data-f="r" data-k="${k}" value="${esc(t.r)}" inputmode="numeric" aria-label="Seria ${k+1} powtórzenia"><button class="x" data-act="rm" data-k="${k}" type="button" aria-label="Usuń serię">×</button>`).join("")}
      </div>
      <div class="rowline">
        <button class="btn sm" data-act="add" type="button">+ Seria</button>
        <label class="rir">Zapas w ost. serii <select id="rir-${day}-${e.id}" data-f="rir"><option value="">–</option>${["0","1","2","3","4","5+"].map(o=>`<option${x.rir===o?" selected":""}>${o}</option>`).join("")}</select></label>
        <button class="btn sm pri" data-act="rest" type="button">Przerwa ${Math.floor(e.sec/60)}:${String(e.sec%60).padStart(2,"0")}</button>
      </div>
      <div class="prev">${prev?`Ostatnio (${fmtDate(prev.date)}): ${esc(setsTxt(prev))}${prev.rir?` · zapas ${esc(prev.rir)}`:""}`:"Brak poprzedniego zapisu"}</div>
    </section>`;
  });
  h+=`<section class="finish"><label for="note-${day}" style="font-weight:600">Notatka po treningu</label>
    <textarea id="note-${day}" data-f="note" placeholder="Samopoczucie, co poszło dobrze, co zmienić następnym razem…">${esc(d.note)}</textarea>
    <div class="rowline"><button class="btn pri" data-act="finish" type="button">Zapisz trening ${day}</button>${saved===day?`<span class="toast">Zapisano w historii</span>`:""}</div></section>`;
  return h;
}
function linkForm(e,v){return `<div class="linkform"><label for="url-${e.id}">Link do filmu (YouTube)</label>
  <div class="row"><input id="url-${e.id}" type="url" placeholder="https://youtu.be/…" value="${esc(v.url||"")}"><button class="btn sm pri" data-act="savelink" type="button">Zapisz</button></div>
  <span class="ytsearch">Szukaj na YT: <a class="btn sm" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.qpl)}" target="_blank" rel="noopener">PL</a><a class="btn sm" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.qen)}" target="_blank" rel="noopener">EN</a></span>
  <label for="nm-${e.id}">Własna nazwa ćwiczenia (opcjonalnie)</label><input id="nm-${e.id}" value="${esc(v.name||"")}" placeholder="${esc(e.name)}">
  <div class="row"><button class="btn sm ghost" data-act="cancel" type="button">Anuluj</button>${v.url?`<button class="btn sm ghost" data-act="clearlink" type="button">Usuń link</button>`:""}<span class="prev" id="lerr-${e.id}"></span></div></div>`}
function renderHistory(){
  if(!S.sessions.length)return `<div class="empty">Tu pojawią się zapisane treningi. Wypełnij serie w zakładce A lub B i stuknij „Zapisz trening”.</div>`;
  return S.sessions.map(s=>{const P=PLAN[s.day]||{ex:[]};return `<details class="sess"><summary><span class="badge ${s.day}">${s.day}</span><strong>${fmtDate(s.date)}</strong><span class="prev">tydz. ${s.week||"–"}</span></summary>
    <table>${histRows(s,P).map(([id,nm])=>`<tr><td>${esc(nm)}</td><td class="v">${esc(setsTxt(s.ex[id]))}${s.ex[id].rir?`<br>zapas ${esc(s.ex[id].rir)}`:""}</td></tr>`).join("")}</table>
    ${s.note?`<p class="note" style="margin-top:8px">${esc(s.note)}</p>`:""}
    <div style="margin-top:8px" data-sid="${s.id}">${confirmDel===s.id?`<span class="prev">Usunąć ten trening?</span> <button class="btn sm" data-act="delyes" type="button">Usuń</button> <button class="btn sm ghost" data-act="delno" type="button">Anuluj</button>`:`<button class="btn sm ghost" data-act="del" type="button">Usuń wpis</button>`}</div></details>`}).join("");
}
/* history rows: plan order first, then anything else saved; name follows the exercise actually done */
function histRows(s,P){
  const ids=[...P.ex.map(e=>e.id),...Object.keys(s.ex).filter(k=>!P.ex.some(e=>e.id===k))];
  return ids.filter(id=>s.ex[id]&&s.ex[id].sets&&s.ex[id].sets.some(t=>t.w||t.r)).map(id=>{
    const v=s.ex[id],slot=slotById(id);let nm;
    if(slot&&(v.cat||slot.def)===slot.def){const E=eff({...slot});E.cat=slot.def;E.name=slot.planName;nm=vid(E).name||slot.planName}
    else if(v.cat&&CAT[v.cat])nm=CAT[v.cat].name_pl;
    else nm=RETIRED[id]||id;
    return [id,nm]})}
let confirmDel=null;

/* ---------- events ---------- */
$("#planBtn").addEventListener("click",()=>openCreator());
document.querySelector(".tabs").addEventListener("click",ev=>{const t=ev.target.closest(".tab");if(!t)return;view=t.dataset.v;viewChosen=true;editing=null;saved=null;try{localStorage.setItem("ab.view",view)}catch(e){}document.activeElement.blur();render();window.scrollTo(0,0)});
$("#main").addEventListener("input",ev=>{
  const f=ev.target.dataset.f;if(!f||view==="H")return;const d=draft(view);
  if(f==="note"){d.note=ev.target.value}else{const ex=ev.target.closest(".ex").dataset.ex,x=d.ex[ex];
    if(f==="rir")x.rir=ev.target.value;else x.sets[+ev.target.dataset.k][f]=ev.target.value}
  putDraft(view,d);
});
$("#main").addEventListener("change",ev=>{if(ev.target.dataset.f==="r"){const s=ev.target.closest(".ex"),d=draft(view);const x=d.ex[s.dataset.ex];s.classList.toggle("done",x.sets.every(t=>t.r))}});
$("#main").addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;const act=b.dataset.act;
  const sec=b.closest(".ex"),exId=sec&&sec.dataset.ex,slot=exId&&PLAN[view]?PLAN[view].ex.find(z=>z.id===exId):null,e=slot?eff(slot):null;
  if(act==="creator"){openCreator();return}
  if(act==="swap"){openSwap(exId);return}
  if(act==="restore"){await saveSwap(exId,null);b.blur();render();return}
  if(act==="edit"){editing=exId;b.blur();render();const i=document.getElementById("url-"+exId);i&&i.focus();return}
  if(act==="cancel"){editing=null;b.blur();render();return}
  if(act==="savelink"){const u=document.getElementById("url-"+exId).value.trim(),nm=document.getElementById("nm-"+exId).value.trim();
    if(u&&!isUrl(u)){document.getElementById("lerr-"+exId).textContent="To nie wygląda na link. Wklej adres zaczynający się od https://";return}
    editing=null;b.blur();await saveVideo(exId,{url:u,name:nm,cat:e.cat});render();return}
  if(act==="clearlink"){editing=null;b.blur();await saveVideo(exId,{url:"",name:vid(e).name||"",cat:e.cat});render();return}
  if(act==="add"||act==="rm"){const d=draft(view),x=d.ex[exId];if(act==="add"){const l=x.sets[x.sets.length-1]||{w:""};x.sets.push({w:l.w,r:""})}else x.sets.splice(+b.dataset.k,1);putDraft(view,d);b.blur();render();return}
  if(act==="rest"){if(tEx)render();startTimer(e.sec,exName(e),exId);return}
  if(act==="finish"){const d=draft(view);const has=Object.values(d.ex).some(x=>x.sets.some(t=>t.w||t.r));
    if(!has){saved=null;b.insertAdjacentHTML("afterend",`<span class="prev">Najpierw wpisz choć jedną serię.</span>`);return}
    const ex={};Object.entries(d.ex).forEach(([k,v])=>{const sl=slotById(k);ex[k]=sl?{...v,cat:eff(sl).cat}:v});
    await saveSession({id:d.date+"-"+view,day:view,date:d.date,week:blockWeek(),ts:Date.now(),ex,note:d.note,plan:PLANOBJ.id});saved=view;b.blur();render();return}
  if(act==="del"){confirmDel=b.closest("[data-sid]").dataset.sid;render();return}
  if(act==="delno"){confirmDel=null;render();return}
  if(act==="delyes"){const id=confirmDel;confirmDel=null;await deleteSession(id);render();return}
});

/* ---------- „Zamień”: pick any exercise from the catalog ---------- */
let swapFor=null,swapQ="",swapAll=false;
function openSwap(slotId){swapFor=slotId;swapQ="";swapAll=false;document.body.classList.add("lock");$("#swap").hidden=false;renderSwap();$("#swap").scrollTop=0}
function closeSwap(){swapFor=null;$("#swap").hidden=true;document.body.classList.remove("lock");render()}
function item(id,cur){const c=CAT[id];if(!c)return "";
  const meta=[DICT.equipment[c.equipment]||"",(c.primary||[]).map(m=>DICT.muscles[m]||m).join(", ")].filter(Boolean).join(" · ");
  return `<li><button class="pick${id===cur?" cur":""}" data-pick="${esc(id)}" type="button"><span class="pn">${esc(c.name_pl)}${c.basic?` <span class="badge-basic">podstawowe</span>`:""}${id===cur?` <span class="badge-cur">teraz</span>`:""}</span><span class="pm">${esc(meta)}</span></button></li>`}
function renderSwap(){
  const slot=slotById(swapFor);if(!slot){closeSwap();return}
  const E=eff(slot),cur=CAT[E.cat]||{},q=norm(swapQ).trim();
  let body="";
  if(q){
    const words=q.split(/\s+/);
    const hits=Object.entries(CAT).filter(([id,c])=>{const hay=norm([c.name_pl,c.name_en,...(c.aliases||[]),DICT.equipment[c.equipment],DICT.pattern[c.pattern]].join(" "));return words.every(w=>hay.includes(w))})
      .sort((a,b)=>(b[1].basic?1:0)-(a[1].basic?1:0)||a[1].name_pl.localeCompare(b[1].name_pl,"pl")).slice(0,60);
    body=hits.length?`<h4>Wyniki (${hits.length})</h4><ul class="picks">${hits.map(([id])=>item(id,E.cat)).join("")}</ul>`:`<p class="note">Nic nie znaleziono. Spróbuj innej nazwy, np. „wiosłowanie”, „hantle”, „łydki”.</p>`;
  }else{
    const ez=(cur.easier||[]).filter(i=>CAT[i]),hd=(cur.harder||[]).filter(i=>CAT[i]);
    const same=Object.entries(CAT).filter(([id,c])=>c.pattern===cur.pattern&&id!==E.cat&&!ez.includes(id)&&!hd.includes(id))
      .sort((a,b)=>(b[1].basic?1:0)-(a[1].basic?1:0)||a[1].name_pl.localeCompare(b[1].name_pl,"pl"));
    const shown=swapAll?same:same.slice(0,8);
    if(ez.length)body+=`<h4>Łatwiej</h4><ul class="picks">${ez.map(i=>item(i,E.cat)).join("")}</ul>`;
    if(hd.length)body+=`<h4>Trudniej</h4><ul class="picks">${hd.map(i=>item(i,E.cat)).join("")}</ul>`;
    body+=`<h4>Ten sam ruch: ${esc(DICT.pattern[cur.pattern]||"")}</h4><ul class="picks">${shown.map(([id])=>item(id,E.cat)).join("")}</ul>`;
    if(!swapAll&&same.length>shown.length)body+=`<button class="btn sm ghost" data-more="1" type="button">Pokaż wszystkie (${same.length})</button>`;
  }
  $("#swapbody").innerHTML=`
    <p class="note">Teraz: <strong>${esc(E.name)}</strong>${E.swapped?` · w planie: ${esc(slot.planName)}`:""}. Serie, powtórzenia i przerwy zostają z planu.</p>
    ${E.swapped?`<button class="btn sm" data-pick="${esc(slot.def)}" type="button">↺ Przywróć z planu: ${esc(slot.planName)}</button>`:""}
    ${body}`;
}
$("#swap").addEventListener("click",async ev=>{
  if(ev.target.closest("[data-close]")){closeSwap();return}
  if(ev.target.closest("[data-more]")){swapAll=true;renderSwap();return}
  const b=ev.target.closest("[data-pick]");if(!b)return;
  const slot=swapFor;await saveSwap(slot,b.dataset.pick);closeSwap();
  const el=document.querySelector(`.ex[data-ex="${slot}"]`);if(el)el.scrollIntoView({block:"center"});
});
$("#swapq").addEventListener("input",ev=>{swapQ=ev.target.value;renderSwap()});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&swapFor)closeSwap()});

/* ---------- kreator planu: cel → ćwiczenia podstawowe + serie/powtórzenia/przerwy z protokołu ---------- */
let creatorOpen=false, crPreview=null, crConfirm=false, crSeed=1;
const CR=(()=>{try{return JSON.parse(localStorage.getItem("ab.creator"))||{}}catch(e){return {}}})();
const crOpt=Object.assign({goal:"general",days:"2",time:"60",level:"beginner",equip:"gym",limits:[],accents:[]},CR);
function openCreator(){creatorOpen=true;crPreview=null;crConfirm=false;document.body.classList.add("lock");$("#creator").hidden=false;renderCreator();$("#creator").scrollTop=0}
function closeCreator(){creatorOpen=false;$("#creator").hidden=true;document.body.classList.remove("lock");render()}
function rnd(seed){let x=seed%2147483647;if(x<=0)x+=2147483646;return ()=>(x=x*16807%2147483647)/2147483647}
function genPlan(o,seed){
  const G=GOALS.goals.find(g=>g.id===o.goal),tpl=GOALS.templates[o.days],cap=GOALS.time[o.time],r=rnd(seed);
  const eq=GOALS.equipment.find(x=>x.id===o.equip),lv=GOALS.levels.find(x=>x.id===o.level);
  const lims=GOALS.limits.filter(l=>o.limits.includes(l.id));
  const ok=(id,c)=>(eq.allow.includes(c.equipment)||(eq.allow_ids||[]).includes(id))&&(!c.level||lv.allow.includes(c.level))&&!(lv.avoid_ids||[]).includes(id)&&
    !lims.some(l=>l.avoid_ids.includes(id)||l.avoid_patterns.includes(c.pattern)||l.avoid_words.some(w=>String(c.avoid||"").toLowerCase().includes(w)));
  const used=new Set();
  function pick(pat,role,dayUsed,fb){
    const cands=Object.entries(CAT).filter(([id,c])=>c.pattern===pat&&ok(id,c)&&!dayUsed.has(id));
    if(!cands.length){const f=(GOALS.fallback||{})[pat];return f&&!fb?pick(f,role,dayUsed,true):null}
    const score=([id,c])=>(c.basic?10:0)+((eq.prefer||[]).includes(c.equipment)?3:0)+(c.level==="beginner"&&o.level==="beginner"?2:0)
      +(role==="core"&&String(c.measure).startsWith("time")?1:0)-(used.has(id)?8:0)-(role==="main"&&c.mechanic==="isolation"?8:0)+r()*3;
    const best=cands.map(x=>[x,score(x)]).sort((a,b)=>b[1]-a[1])[0][0][0];
    used.add(best);dayUsed.add(best);return best;
  }
  const roleOrder={mobility:0,main:1,extra:2,accessory:3,prehab:3,core:4};
  const id="gen-"+today().replace(/-/g,"")+"-"+Math.floor(Date.now()/1000%100000);
  const days=tpl.map((d,di)=>{
    let slots=d.slots.map(([pat,role])=>({pat,role,prio:roleOrder[role]}));
    (G.extra||[]).forEach(pat=>slots.push({pat,role:pat==="mobility"?"mobility":pat==="prehab_shoulder"?"prehab":"accessory",prio:pat==="mobility"?0:2}));
    GOALS.accents.filter(a=>o.accents.includes(a.id)).forEach(a=>a.add.forEach(([pat,role])=>{
      const upper=["pull_h","pull_v","push_h","push_v","shoulder_iso","prehab_shoulder","arms"].includes(pat);
      const isUpper=/Góra/.test(d.title),isLower=/Dół/.test(d.title);
      if((upper&&isLower)||(!upper&&isUpper&&pat!=="core_flex"&&pat!=="core_lat"))return;
      slots.push({pat,role,prio:2})}));
    slots.sort((a,b)=>a.prio-b.prio);
    // trim to time: drop accessories from the end, keep mains and one core exercise
    while(slots.length>cap){const i=[...slots].reverse().findIndex(x=>x.prio===3||(x.prio===2&&!slots.some(y=>y.prio===3)));
      if(i<0){const j=slots.findIndex((x,k)=>x.prio===0&&slots.findIndex(y=>y.prio===0)!==k);if(j<0)break;slots.splice(j,1)}
      else slots.splice(slots.length-1-i,1)}
    const dayUsed=new Set();
    const ex=slots.map((sl,i)=>{const c_id=pick(sl.pat,sl.role,dayUsed);if(!c_id)return null;
      const c=CAT[c_id],R=G.roles[sl.role==="extra"?"accessory":sl.role],timed=String(c.measure).startsWith("time");
      let early=R.early,late=R.late;
      if(sl.role==="core"){if(!timed){early=R.reps_early;late=R.reps_late}}
      else if(timed&&sl.role!=="mobility"){early=G.roles.core.early;late=G.roles.core.late}
      const side=String(c.measure).endsWith("_side")&&!/str\./.test(early)?"/str.":"";
      return {slot:`${id.slice(4)}-${d.key.toLowerCase()}${i+1}`,exercise:c_id,sets:{early:early+side,late:late+side},rest:R.rest,rest_sec:R.rest_sec,
        note:sl.role==="main"&&R.intensity?"Intensywność: "+R.intensity+".":""}}).filter(Boolean);
    return {key:d.key,tab:GOALS.tabs[o.days][di],weekdays:GOALS.weekdays[o.days][di],title:d.title,sub:`${G.name} · ok. ${o.time} min`,exercises:ex};
  });
  return {id,name:"Plan: "+G.name,source:"kreator",goal:G.id,options:{...o},
    block:{default_start:today(),weeks:8,review_week:6,late_from_week:3,stage_hints:[
      {from:1,to:2,text:"Tygodnie 1–2: naucz się ruchów, lżej, ok. 3 powtórzenia w zapasie."},
      {from:3,to:6,text:"Od tygodnia 3: docelowa liczba serii; najpierw dokładaj powtórzenia, potem ciężar."},
      {from:7,to:99,text:"Tygodnie 7–8: kontynuuj; przy zmęczeniu zrób lżejszy tydzień."}]},
    warmup:{title:"Rozgrzewka · 8–10 min",items:["5 min spokojnego rowerka, orbitreka lub marszu","Swobodne ruchy barków, bioder i kolan","Przed pierwszym ćwiczeniem: 1–2 lekkie serie"]},
    days,retired:{}};
}
function chip(name,val,cur,label,multi){const on=multi?cur.includes(val):cur===val;
  return `<button class="opt${on?" on":""}" data-opt="${name}" data-val="${esc(val)}" type="button" aria-pressed="${on}">${label}</button>`}
function renderCreator(){
  const o=crOpt,G=GOALS.goals;
  let h=`<p class="note">Wybierz cel i warunki — apka ułoży plan z podstawowych ćwiczeń, a serie, powtórzenia i przerwy dobierze do celu. Każde ćwiczenie możesz potem zmienić przyciskiem „Zamień”.</p>
  <h4>Cel</h4><div class="goals">${G.map(g=>`<button class="goal${o.goal===g.id?" on":""}" data-opt="goal" data-val="${g.id}" type="button" aria-pressed="${o.goal===g.id}"><span class="pn">${esc(g.name)}</span><span class="pm">${esc(g.who)}</span><span class="pm mono">główne ${esc(g.roles.main.late)} · przerwa ${esc(g.roles.main.rest)}</span></button>`).join("")}</div>
  <h4>Treningi w tygodniu</h4><div class="opts">${["2","3","4"].map(v=>chip("days",v,o.days,v)).join("")}</div>
  <h4>Czas treningu</h4><div class="opts">${["45","60","75"].map(v=>chip("time",v,o.time,v+" min")).join("")}</div>
  <h4>Poziom</h4><div class="opts">${GOALS.levels.map(l=>chip("level",l.id,o.level,esc(l.name))).join("")}</div>
  <h4>Sprzęt</h4><div class="opts">${GOALS.equipment.map(l=>chip("equip",l.id,o.equip,esc(l.name))).join("")}</div>
  <h4>Ograniczenia (opcjonalnie)</h4><div class="opts">${GOALS.limits.map(l=>chip("limits",l.id,o.limits,esc(l.name),1)).join("")}</div>
  <h4>Akcent (opcjonalnie)</h4><div class="opts">${GOALS.accents.map(l=>chip("accents",l.id,o.accents,esc(l.name),1)).join("")}</div>
  <div class="rowline" style="margin-top:12px"><button class="btn pri" data-cr="gen" type="button">Ułóż plan</button>${crPreview?`<button class="btn sm ghost" data-cr="again" type="button">Inne ćwiczenia</button>`:""}</div>`;
  if(crPreview){
    h+=`<div class="preview"><h4>Podgląd: ${esc(crPreview.name)}</h4>${crPreview.days.map(d=>`<div class="pday"><strong>${esc(d.tab)} — ${esc(d.title)}</strong><ol>${d.exercises.map(x=>`<li><span>${esc(CAT[x.exercise].name_pl)}</span><span class="mono">${esc(x.sets.early===x.sets.late?x.sets.early:x.sets.early+" → "+x.sets.late)} · ${esc(x.rest)}</span></li>`).join("")}</ol></div>`).join("")}
      <p class="note">Liczby: tygodnie 1–2 → od tygodnia 3. To podpowiedź, nie zalecenie medyczne — przy dolegliwościach skonsultuj ćwiczenia z fizjoterapeutą.</p>
      ${crConfirm?`<div class="dialog"><strong>Zastąpić obecny plan?</strong><p class="note">Apka będzie pokazywać nowy plan. Zapisane treningi zostają w historii${DATA.plan?`, a do planu „${esc(DATA.plan.name)}” wrócisz jednym przyciskiem`:""}.</p><div class="rowline"><button class="btn pri" data-cr="save" type="button">Tak, zapisz</button><button class="btn sm ghost" data-cr="nosave" type="button">Anuluj</button></div></div>`
        :`<button class="btn pri" data-cr="ask" type="button">Zapisz jako mój plan</button>`}</div>`;
  }
  if(planSource==="creator"&&DATA.plan)h+=`<div class="dialog" style="margin-top:16px"><span class="note">Teraz używasz planu z kreatora: <strong>${esc(PLANOBJ.name)}</strong>.</span><button class="btn sm" data-cr="restore" type="button">↺ Wróć do planu „${esc(DATA.plan.name)}”</button></div>`;
  $("#crbody").innerHTML=h;
}
$("#creator").addEventListener("click",async ev=>{
  if(ev.target.closest("[data-crclose]")){closeCreator();return}
  const ob=ev.target.closest("[data-opt]");
  if(ob){const k=ob.dataset.opt,v=ob.dataset.val;
    if(Array.isArray(crOpt[k]))crOpt[k]=crOpt[k].includes(v)?crOpt[k].filter(x=>x!==v):[...crOpt[k],v];else crOpt[k]=v;
    try{localStorage.setItem("ab.creator",JSON.stringify(crOpt))}catch(e){}
    if(crPreview)crPreview=genPlan(crOpt,crSeed);crConfirm=false;renderCreator();return}
  const b=ev.target.closest("[data-cr]");if(!b)return;const a=b.dataset.cr;
  if(a==="gen"){crSeed=1;crPreview=genPlan(crOpt,crSeed);crConfirm=false;renderCreator();const pv=$("#crbody .preview");pv&&pv.scrollIntoView({block:"start"});return}
  if(a==="again"){crSeed++;crPreview=genPlan(crOpt,crSeed);crConfirm=false;renderCreator();return}
  if(a==="ask"){crConfirm=true;renderCreator();return}
  if(a==="nosave"){crConfirm=false;renderCreator();return}
  if(a==="save"){await savePlan(crPreview);view=defaultView();closeCreator();window.scrollTo(0,0);return}
  if(a==="restore"){await clearPlan();view=defaultView();closeCreator();window.scrollTo(0,0);return}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&creatorOpen)closeCreator()});

/* week setting */
$("#weekBtn").addEventListener("click",()=>{const w=$("#weekDlg");if(!w.hidden){w.hidden=true;return}
  w.innerHTML=`<div class="dialog" style="margin-top:12px"><label for="startIn" style="font-weight:600">Pierwszy tydzień bloku zaczął się</label><input id="startIn" type="date" value="${blockStart()}"><p class="note">Od numeru tygodnia zależy liczba serii (tyg. 1–${BLOCK.late_from_week-1} vs od tyg. ${BLOCK.late_from_week}). Blok trwa ${BLOCK.weeks} tygodni.</p><div class="rowline"><button class="btn sm pri" id="startSave" type="button">Zapisz</button></div></div>`;
  w.hidden=false;$("#startSave").onclick=async()=>{const v=$("#startIn").value;if(v){await saveSettings({start:v,planId:PLANOBJ.id})}w.hidden=true;render()}});

/* rest timer */
let tEnd=0,tInt=null,lock=null,tEx=null;
function startTimer(sec,label,exId){tEx=exId||null;tEnd=Date.now()+sec*1000;$("#tlbl").textContent=label;$("#timer").hidden=false;$("#timer").classList.remove("over");clearInterval(tInt);tick();tInt=setInterval(tick,250);
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>lock=l).catch(()=>{})}catch(e){}}
function tick(){const left=Math.round((tEnd-Date.now())/1000),a=Math.abs(left),txt=(left<0?"+":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0");$("#clock").textContent=txt;
  const rb=tEx&&document.querySelector(`.ex[data-ex="${tEx}"] [data-act="rest"]`);if(rb)rb.textContent=(left<0?"Czas! ":"⏱ ")+txt;
  if(left<=0&&!$("#timer").classList.contains("over")){$("#timer").classList.add("over");$("#tlbl").textContent="Czas na kolejną serię";try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}}
$("#tplus").onclick=()=>{tEnd+=30000;$("#timer").classList.remove("over");tick()};
$("#tstop").onclick=()=>{clearInterval(tInt);$("#timer").hidden=true;tEx=null;try{lock&&lock.release()}catch(e){}render()};

/* start: pick the day by weekday (each plan day lists its weekdays) */
function defaultView(){const wd=new Date().getDay();return DAYS.find(k=>(PLAN[k].weekdays||[]).includes(wd))||DAYS[0]||"H"}
(function(){view=defaultView();
  const h=location.hash.replace("#","").toUpperCase();if(h==="H"||PLAN[h]){view=h;viewChosen=true}
  render();initStore();})();
</script>
